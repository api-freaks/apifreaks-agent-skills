name: validate

on:
  pull_request:
    paths: ["skills/**"]
  push:
    branches: [main]
    paths: ["skills/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          for skill in skills/*/; do
            npx --yes skills-ref@0.1.5 validate "$skill"
          done
